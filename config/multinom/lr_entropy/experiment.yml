# ============================================================
# Experiment metadata
# ============================================================
experiment:
  name: multinom_logistic_regression_entropy
  description: >
    DOE exploring IL vs PL across J, n, and entropy

# ============================================================
# Base simulation template (STATIC)
# ============================================================
base_simulation:

  experiment:
    distribution: multinomial
    model: logistic_regression
    estimand: entropy
    spec_path: specs/multinom/lr_entropy
    seed_base: 5000

  parameter:
    J: 5
    entropy_target_frac: 0.25
    lower: 0.0
    upper: 1.0

  likelihood:
    family: multinomial
    link: logit

  estimand:
    increment: 0.01
    confidence_levels: [0.90, 0.95, 0.99]
    gamma: 0.9
    cutoff_buffer: 0.05
    uniroot_expand_factor: 0.02
    psi_lower: 0.0

  nuisance:
    name: "Multinomial cell probabilities entropy nuisance parameter (ZSE)"

  optimizer:
    localsolver: SLSQP
    control:
      xtol_rel: 1.0e-08
      maxeval: 1000
    localtol: 1.0e-06
    max_retries: 50
    stop_at_bounds: TRUE
    eval_at_bounds: TRUE
    branch_mode_locator_method: hybrid
    branch_agg_args:
      min_points: 10
      q_delta: 0.20
      delta_min: 20
      delta_max: 80
      min_support: NULL

  execution:
    R: 250
    packages: likelyr

  data:
    n_obs: 25

# ============================================================
# Design: how simulations differ
# ============================================================
design:
  type: grid
  factors:
    parameter.J: [5, 15, 30]
    parameter.entropy_target_frac: [0.25, 0.5, 0.75]
    data.n_obs: [25, 50, 75]

# ============================================================
# Simulation execution (experiment-wide)
# ============================================================
simulation:
  iterations: 1000
