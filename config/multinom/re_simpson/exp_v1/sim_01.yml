experiment:
  version: exp_v1
  distribution: multinomial
  model: re
  estimand: simpson
  seed_base: 9000
  specs_dir: /gpfs/home/tbr0780/likelyr-simulations/specs/multinom/re_simpson
  exp_dir: /gpfs/projects/p32397/likelyr-simulations/experiments/multinom/re_simpson/exp_v1
simulation:
  sim_id: sim_01
  seed_base: 109000
  iterations: 1100
design:
  design_type: points
  overrides:
    parameter.J: 5
    data.n_clusters: 20
    data.m: 3
    parameter.index_target_frac: 0.1
test:
  simulation.iterations: 5
  sampler.min_branches: 10
  sampler.branch_buffer: 5
  parameter.J: 5
  data.n_clusters: 10
  data.m: 3
  parameter.index_target_frac: 0.1
parameter:
  J: 5
  index_target_frac: 0.1
  sigma2_u: 0.5
  coefficient_distribution:
    name: rnorm
    args:
    - 0.0
    - 1.0
  seed: 109000
likelihood:
  family: multinomial
  link: logit
sampler:
  min_branches: 200
  branch_buffer: 50
  seed_base: 119000
traversal:
  increment: 0.01
  traversal_method: topdown
  confidence_levels:
  - 0.9
  - 0.95
  - 0.99
  cutoff_buffer: 1.5
  n_adjacent: 3
  max_mode_shifts: 10
  k_recent: 3
  drop_multiplier: 10.0
  cap_multiplier: 10.0
  mode_gap_multiplier: 10.0
  interval_buffer: 1.2
  max_drop_frac: 10.0
  resid_tol: 0.001
  profile_retry_on: constraint
  branch_retry_on: constraint
  rejection_reasons:
  - empty_restricted_grid
  - no_feasible_grid_point
  - mode_on_psi_boundary
  - mode_locator_failed
  - mode_eval_failed_after_snap
  - oscillation
  - mode_shift_exhausted
  - jump_left
  - jump_right
  use_mode_locator_for_profile: yes
solver:
  localsolver: SLSQP
  control:
    xtol_rel: 1.0e-08
    maxeval: 1000
  localtol: 1.0e-06
  max_retries: 100
execution:
  mode: serial
  packages: likelyr
data:
  n_clusters: 20
  m: 3
  formula: Y ~ X1 + X2
  epsilon: 0.5
  predictors:
  - symbol: X1
    distribution:
      name: rnorm
      args:
      - 0.0
      - 1.0
  - symbol: X2
    distribution:
      name: rnorm
      args:
      - 0.0
      - 1.0
  seed_base: 129000
