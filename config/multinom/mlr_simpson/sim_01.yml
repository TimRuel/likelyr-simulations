experiment:
  version: exp_v1
  distribution: multinomial
  model: mlr
  estimand: simpson
  seed_base: 8000
  specs_dir: /gpfs/home/tbr0780/likelyr-simulations/specs/multinom/mlr_simpson
  logs_dir: /gpfs/home/tbr0780/likelyr-simulations/logs/multinom/mlr_simpson/exp_v1
  exp_dir: /gpfs/projects/p32397/likelyr-simulations/experiments/multinom/mlr_simpson/exp_v1
simulation:
  sim_id: sim_01
  seed_base: 108000
  iterations: 2000
design:
  design_type: points
  overrides:
    parameter.J: 5
    data.n_obs: 20
    parameter.index_target_frac: 0.1
test:
  simulation.iterations: 2
  sampler.min_branches: 3
  sampler.branch_buffer: 0
  data.n_obs: 50
  parameter.J: 5
  parameter.index_target_frac: 0.1
model:
  formula: Y ~ X1 + X2
parameter:
  J: 5
  index_target_frac: 0.1
  coefficient_distribution:
    name: rnorm
    args:
    - 0.0
    - 0.5
  seed: 108000
likelihood:
  family: multinomial
  link: logit
sampler:
  min_branches: 5
  branch_buffer: 0
  seed_base: 118000
traversal:
  increment: 0.005
  traversal_method: topdown
  confidence_levels:
  - 0.9
  - 0.95
  - 0.99
  cutoff_buffer: 1.5
  n_adjacent: 3
  max_mode_shifts: 20
  k_recent: 3
  drop_multiplier: 10.0
  cap_multiplier: 10.0
  mode_gap_multiplier: 10.0
  interval_buffer: 1.2
solver:
  localsolver: SLSQP
  control:
    xtol_rel: 1.0e-08
    maxeval: 1000
  localtol: 1.0e-06
  max_retries: 100
execution:
  mode: serial
  packages: likelyr
data:
  n_obs: 20
  epsilon: 0.5
  predictors:
  - symbol: X1
    distribution:
      name: rexp
      args: 1.0
  - symbol: X2
    distribution:
      name: rnorm
      args:
      - 0.0
      - 1.0
  seed_base: 128000
