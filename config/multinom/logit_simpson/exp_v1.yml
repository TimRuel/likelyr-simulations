experiment:
  version: exp_v1
  distribution: multinomial
  model: logit
  estimand: simpson
  spec_path: specs/multinom/logit_simpson
  seed_base: 8000

test:
  sampler.min_branches: 50
  sampler.branch_buffer: 25

design:
  type: points
  require_existing_paths: true
  points:
    # param_dim = 9  (orbit_size = 18)
    - parameter.param_dim: 9
      sampler.orbit_size: 18
      data.n_obs: 100
    - parameter.param_dim: 9
      sampler.orbit_size: 18
      data.n_obs: 250
    - parameter.param_dim: 9
      sampler.orbit_size: 18
      data.n_obs: 500

    # param_dim = 24  (orbit_size = 48)
    - parameter.param_dim: 24
      sampler.orbit_size: 48
      data.n_obs: 100
    - parameter.param_dim: 24
      sampler.orbit_size: 48
      data.n_obs: 250
    - parameter.param_dim: 24
      sampler.orbit_size: 48
      data.n_obs: 500

    # param_dim = 49  (orbit_size = 98)
    - parameter.param_dim: 49
      sampler.orbit_size: 98
      data.n_obs: 100
    - parameter.param_dim: 49
      sampler.orbit_size: 98
      data.n_obs: 250
    - parameter.param_dim: 49
      sampler.orbit_size: 98
      data.n_obs: 500

    # param_dim = 74  (orbit_size = 148)
    - parameter.param_dim: 74
      sampler.orbit_size: 148
      data.n_obs: 100
    - parameter.param_dim: 74
      sampler.orbit_size: 148
      data.n_obs: 250
    - parameter.param_dim: 74
      sampler.orbit_size: 148
      data.n_obs: 500

base_simulation:
  iterations: 1000

  parameter:
    param_dim: null          # set per-simulation; varies across design points
    index_target_frac: 0.5

  likelihood:
    family: multinomial
    link: logit

  sampler:
    min_branches: 250
    branch_buffer: 50
    orbit_size: null         # set per-simulation; always 2 * param_dim

  traversal:
    increment: 0.001
    traversal_method: topdown
    confidence_levels:
      - 0.9
      - 0.95
      - 0.99
    cutoff_buffer: 1.5
    n_adjacent: 3
    max_mode_shifts: 20
    k_recent: 3
    drop_multiplier: 10.0
    max_drop_fraction: 0.25

  solver:
    localsolver: SLSQP
    control:
      xtol_rel: 1.0e-08
      maxeval: 1000
    localtol: 1.0e-06
    max_retries: 50

  execution:
    mode: serial
    packages: likelyr

  data:
    n_obs: null              # set per-simulation; varies across design points
