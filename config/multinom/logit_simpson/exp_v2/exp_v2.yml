experiment:
  version: exp_v2
  distribution: multinomial
  model: logit
  estimand: simpson
  seed_base: 8000
  specs_dir: /gpfs/home/tbr0780/likelyr-simulations/specs/multinom/logit_simpson
  logs_dir: /gpfs/home/tbr0780/likelyr-simulations/logs/multinom/logit_simpson/exp_v2
  exp_dir: /gpfs/projects/p32397/likelyr-simulations/experiments/multinom/logit_simpson/exp_v2

test:
  simulation.iterations: 2
  sampler.min_branches: 3
  sampler.branch_buffer: 0
  data.n_obs: 50
  parameter.param_dim: 9
  parameter.index_target_frac: 0.10

design:
  type: points
  require_existing_paths: true
  # index_target_frac = f in {0.10, 0.20, 0.35}
  # psi_0 = 1/J + f * (1 - 1/J)
  # n_obs = (n/J) * J, n/J in {2, 4, 6}
  points:
    # J = 5  (param_dim = 4)
    - parameter.param_dim: 4
      data.n_obs: 10
      parameter.index_target_frac: 0.10

base_simulation:
  iterations: 1000

  parameter:
    param_dim: null          # set per-simulation; varies across design points
    index_target_frac: 0.10

  likelihood:
    family: multinomial
    link: logit

  sampler:
    min_branches: 250
    branch_buffer: 50

  traversal:
    increment: 0.001
    traversal_method: topdown
    confidence_levels:
      - 0.9
      - 0.95
      - 0.99
    cutoff_buffer: 1.5
    n_adjacent: 3
    max_mode_shifts: 20
    k_recent: 3
    drop_multiplier: 10.0
    cap_multiplier: 10.0
    mode_gap_multiplier: 10.0
    interval_buffer: 1.2

  solver:
    localsolver: SLSQP
    control:
      xtol_rel: 1.0e-08
      maxeval: 1000
    localtol: 1.0e-06
    max_retries: 50

  execution:
    mode: serial
    packages: likelyr

  data:
    n_obs: null              # set per-simulation; varies across design points
