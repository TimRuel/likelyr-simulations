experiment:
  distribution: multinomial
  model: baseline_logit
  estimand: entropy
  spec_path: specs/multinom/logit_entropy
  seed_base: 4000
parameter:
  J: 30.0
  entropy_target_frac: 0.75
  lower: 0.0
  upper: 1.0
  seed: 4025
likelihood:
  family: multinomial
  link: logit
estimand:
  increment: 0.01
  confidence_levels:
  - 0.9
  - 0.95
  - 0.99
  gamma: 0.9
  cutoff_buffer: 0.05
  uniroot_expand_factor: 0.02
  psi_lower: 0.0
nuisance:
  name: Multinomial cell probabilities entropy nuisance parameter (ZSE)
optimizer:
  localsolver: SLSQP
  control:
    xtol_rel: 1.0e-08
    maxeval: 1000
  localtol: 1.0e-06
  max_retries: 50
  stop_at_bounds: yes
  eval_at_bounds: yes
  branch_mode_locator_method: hybrid
  branch_agg_args:
    min_points: 10
    q_delta: 0.2
    delta_min: 20
    delta_max: 80
    min_support: ~
execution:
  R: 250
  packages: likelyr
  seed: 14025.0
data:
  n_obs: 25.0
design:
  experiment: multinom_baseline_logit_entropy
  design_type: grid
  sim_index: 25
  sim_seed: 4025
  overrides:
    data.n_obs: 25.0
    parameter.entropy_target_frac: 0.75
    parameter.J: 30.0
simulation:
  iterations: 1000
  sim_id: sim_25
